[package]
name = "cloudsurf-rate-limiter"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "IP-based sliding window rate limiter for CloudSurf Rust servers"
repository = "https://github.com/cloudsurf-software/cloudsurf-rate-limiter"

[dependencies]
tokio = { version = "1", features = ["sync", "time"] }
http = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
